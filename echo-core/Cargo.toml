[package]
name = "echo-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror.workspace = true
log = "0.4"
fern = "0.6"
chrono = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "config_bench"
path = "benches/config_bench.rs"
harness = false
